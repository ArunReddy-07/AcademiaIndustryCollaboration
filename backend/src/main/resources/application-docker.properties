# Docker deployment requires deployment-provided connection settings and secrets.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.allowed-origins=${ALLOWED_ORIGINS:https://academiaindustryfrontend.onrender.com}

server.port=${SERVER_PORT:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
