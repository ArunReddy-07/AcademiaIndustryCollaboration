# PostgreSQL and JWT values must be provided as environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Gemini API credentials are read by the backend only; do not add them to frontend configuration.
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.connect-timeout=${GEMINI_CONNECT_TIMEOUT:5s}
app.gemini.read-timeout=${GEMINI_READ_TIMEOUT:30s}

# Optional SMTP settings required to send password reset codes.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@example.com}
