# Local-only defaults. Environment variables override these values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academia_industry_collaboration_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Generate an ephemeral signing secret when JWT_SECRET is not supplied locally.
app.security.jwt-secret=${JWT_SECRET:${random.value}}